services:
  llm_service:
    build:
      context: ./llm_service
      dockerfile: llm.Dockerfile
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: api.Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/app_db
      - LLM_SERVICE_URL=http://llm_service:8000
    depends_on:
      db:
        condition: service_healthy
      llm_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  telegram_bot:
    build:
      context: telegram_bot
      dockerfile: telegram.Dockerfile
    env_file:
      - .env
    environment:
      - API_URL=http://api:8001
    depends_on:
      api:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: